      background: radial-gradient(60% 60% at 85% 20%, color-mix(in oklab, var(--green) 18%, transparent), transparent 70%), radial-gradient(50% 60% at 10% 90%, color-mix(in oklab, var(--blue) 14%, transparent), transparent 70%), radial-gradient(40% 40% at 60% 90%, color-mix(in oklab, var(--orange) 12%, transparent), transparent 70%);
    }
  }
  .meter {
    height: .6rem;
    border-radius: 999px;
    background: var(--surface-2);
    overflow: hidden;
    position: relative;
  }
  .meter > span {
    position: absolute;
    inset-block: 0;
    left: 0;
    border-radius: 999px;
    transition: width .8s cubic-bezier(.2,.8,.2,1);
  }
}
@keyframes float {
  0%, 100% {
    transform: translateY(0) rotate(var(--r, 0deg));
  }
  50% {
    transform: translateY(-12px) rotate(var(--r, 0deg));
  }
}
@keyframes fade-up {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes pop-in {
  from {
    opacity: 0;
    transform: scale(.96);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes organ-glow {
  0%, 100% {
    opacity: .55;
  }
  50% {
    opacity: .9;
  }
}
@keyframes bubble {
  0% {
    transform: translateY(0);
    opacity: 0;
  }
  20% {
    opacity: .9;
  }
  100% {
    transform: translateY(-70px);
    opacity: 0;
  }
}
@keyframes steam {
  0% {
    transform: translateY(0) scaleY(1);
    opacity: 0;
  }
  30% {
    opacity: .6;
  }
  100% {
    transform: translateY(-22px) scaleY(1.2);
    opacity: 0;
  }
}
.animate-float {
  animation: float 6s ease-in-out infinite;
}
.animate-fade-up {
  animation: fade-up .6s cubic-bezier(.2,.8,.2,1) both;
}
.animate-pop {
  animation: pop-in .35s cubic-bezier(.2,.8,.2,1) both;
}
.organ-active {
  animation: organ-glow 2.4s ease-in-out infinite;
}
.art-bubble {
  animation: bubble 3.2s ease-in infinite;
  transform-box: fill-box;
}
.art-steam {
  animation: steam 3s ease-out infinite;
  transform-box: fill-box;
  transform-origin: bottom;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
}
html.reduce-motion *, html.reduce-motion *::before, html.reduce-motion *::after {
  animation-duration: .001ms !important;
  animation-iteration-count: 1 !important;
  transition-duration: .001ms !important;
  scroll-behavior: auto !important;
}
@media print {
  header, footer, .no-print {
    display: none !important;
  }
  body {
    background: #fff;
    color: #000;
  }
}
